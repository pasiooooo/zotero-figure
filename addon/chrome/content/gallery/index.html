<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-l10n-id="gallery-title">PDF Figure Library</title>
    <link rel="localization" href="__addonRef__-addon.ftl" />
    <link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css" />
    <link rel="stylesheet" href="gallery.css?v=__buildTimestamp__" />
    <script>
      Services.scriptloader.loadSubScript(
        "chrome://zotero/content/include.js",
        this,
      );
    </script>
    <script defer src="gallery.js?v=__buildTimestamp__"></script>
  </head>
  <body>
    <header id="filter-toolbar" class="gallery-toolbar">
      <div id="gallery-filter-controls" class="gallery-filters">
        <div class="gallery-field gallery-field-collection">
          <span id="collection-label" data-l10n-id="gallery-filter-collection"
            >Collection</span
          >
          <button
            id="collection-filter"
            class="gallery-filter-trigger"
            type="button"
            aria-describedby="collection-label"
            aria-expanded="false"
            aria-controls="browse-panel"
            aria-haspopup="dialog"
          >
            All collections
          </button>
        </div>
        <div class="gallery-field gallery-field-document">
          <span id="document-label" data-l10n-id="gallery-filter-document"
            >Document</span
          >
          <button
            id="document-filter"
            class="gallery-filter-trigger"
            type="button"
            aria-describedby="document-label"
            aria-expanded="false"
            aria-controls="browse-panel"
            aria-haspopup="dialog"
          >
            All documents
          </button>
        </div>
        <div class="gallery-field gallery-field-year">
          <span id="year-label" data-l10n-id="gallery-filter-year">Year</span>
          <button
            id="year-filter"
            class="gallery-filter-trigger"
            type="button"
            aria-describedby="year-label"
            aria-expanded="false"
            aria-controls="year-panel"
            aria-haspopup="dialog"
          >
            All years
          </button>
        </div>
        <div class="gallery-field gallery-field-type">
          <span id="type-label" data-l10n-id="gallery-filter-type">Type</span>
          <div id="type-filter" role="group" aria-labelledby="type-label"></div>
        </div>
        <label class="gallery-field gallery-field-search">
          <span data-l10n-id="gallery-filter-keyword">Caption keyword</span>
          <input
            id="keyword-filter"
            type="search"
            autocomplete="off"
            data-l10n-id="gallery-filter-keyword-placeholder"
          />
        </label>
        <div class="gallery-summary">
          <span id="result-count" aria-live="polite"></span>
          <button
            id="refresh"
            class="gallery-icon-button"
            type="button"
            data-l10n-id="gallery-refresh"
          >
            <span aria-hidden="true">&#x21bb;</span>
          </button>
        </div>
        <div id="gallery-scale-control" class="gallery-scale-control">
          <button
            id="gallery-scale-toggle"
            class="gallery-icon-button gallery-scale-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="gallery-scale-popover"
            aria-haspopup="dialog"
            data-l10n-id="gallery-scale-toggle"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4M11 8v6M8 11h6" />
            </svg>
          </button>
          <div
            id="gallery-scale-popover"
            class="gallery-scale-popover"
            hidden
            role="dialog"
            aria-labelledby="gallery-scale-label"
          >
            <label class="gallery-scale-label" for="gallery-scale-value">
              <span id="gallery-scale-label" data-l10n-id="gallery-scale-label">
                Image size
              </span>
              <span
                ><input
                  id="gallery-scale-value"
                  type="number"
                  min="10"
                  max="1000"
                  step="1"
                  value="100"
                  aria-labelledby="gallery-scale-label"
                />%</span
              >
            </label>
            <input
              id="gallery-scale-range"
              type="range"
              min="10"
              max="1000"
              step="1"
              value="100"
              data-l10n-id="gallery-scale-range"
            />
          </div>
        </div>
        <button
          id="reset-filters"
          class="gallery-icon-button gallery-reset-filters"
          type="button"
          data-l10n-id="gallery-reset-filters"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <button
          id="layout-mode-toggle"
          class="gallery-icon-button gallery-layout-mode-toggle"
          type="button"
          aria-pressed="false"
          data-l10n-id="gallery-view-switch-to-documents"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="7" height="16" rx="1" />
            <rect x="14" y="4" width="7" height="16" rx="1" />
            <path d="M6 8h1M6 12h1M17 8h1M17 12h1" />
          </svg>
        </button>
        <button
          id="toolbar-toggle"
          class="gallery-icon-button gallery-toolbar-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="gallery-filter-controls"
          data-l10n-id="gallery-toolbar-collapse"
        >
          <svg
            class="gallery-toolbar-toggle-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </div>
      <section
        id="browse-panel"
        class="gallery-filter-popover"
        role="dialog"
        aria-labelledby="browse-title"
        hidden
      >
        <h2 id="browse-title" data-l10n-id="gallery-browse-title">
          Collections &amp; documents
        </h2>
        <div class="gallery-browse-columns">
          <section
            class="gallery-collection-pane"
            aria-labelledby="collection-heading"
          >
            <h3
              id="collection-heading"
              data-l10n-id="gallery-filter-collection"
            >
              Collection
            </h3>
            <p
              class="gallery-filter-hint"
              data-l10n-id="gallery-collection-descendants"
            >
              Includes subcollections
            </p>
            <div
              id="collection-list"
              class="gallery-filter-list"
              tabindex="-1"
            ></div>
          </section>
          <section
            class="gallery-document-pane"
            aria-labelledby="document-heading"
          >
            <h3 id="document-heading" data-l10n-id="gallery-filter-document">
              Document
            </h3>
            <input
              id="document-search"
              type="search"
              autocomplete="off"
              data-l10n-id="gallery-document-search"
              aria-controls="document-list"
            />
            <div
              id="document-list"
              class="gallery-filter-list"
              aria-live="polite"
            ></div>
          </section>
        </div>
      </section>
      <section
        id="year-panel"
        class="gallery-filter-popover gallery-year-panel"
        role="dialog"
        aria-labelledby="year-panel-title"
        hidden
      >
        <div class="gallery-year-heading">
          <h2 id="year-panel-title" data-l10n-id="gallery-filter-year">Year</h2>
          <output id="year-hover" aria-live="polite"></output>
        </div>
        <p
          id="year-histogram-label"
          class="gallery-filter-hint"
          data-l10n-id="gallery-year-histogram"
        >
          Results per year · click a bar to filter
        </p>
        <div
          id="year-histogram"
          role="group"
          aria-labelledby="year-histogram-label"
        ></div>
        <div id="year-axis" class="gallery-year-axis" aria-hidden="true">
          <span id="year-first"></span><span id="year-last"></span>
        </div>
        <label
          class="gallery-year-label"
          for="year-input"
          data-l10n-id="gallery-year-input-label"
          >Year or range</label
        >
        <div class="gallery-year-entry">
          <input
            id="year-input"
            type="text"
            placeholder="2020–2024"
            autocomplete="off"
            aria-describedby="year-error"
          />
          <button
            id="year-apply"
            type="button"
            data-l10n-id="gallery-year-apply"
          >
            Apply
          </button>
          <button
            id="year-clear"
            type="button"
            data-l10n-id="gallery-filter-all-years"
          >
            All years
          </button>
        </div>
        <p id="year-error" role="alert" hidden></p>
      </section>
    </header>

    <main>
      <p id="batch-status" role="status" hidden></p>
      <div id="error-banner" class="gallery-error" hidden role="alert"></div>
      <section id="state" class="gallery-state" aria-live="polite">
        <div class="gallery-spinner" aria-hidden="true"></div>
        <p id="state-message" data-l10n-id="gallery-loading">
          Loading figure index...
        </p>
      </section>
      <section id="gallery-grid" class="gallery-grid" hidden></section>
    </main>
  </body>
</html>
